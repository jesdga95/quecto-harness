      <stop offset="1" stop-color="#FFFFFF" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="brace" x1="0" y1="25" x2="0" y2="79" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#FEE9A0"/>
      <stop offset="0.5" stop-color="#FCD34D"/>
