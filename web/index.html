<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <!-- The PNG and the ICO are for a browser that cannot draw an SVG icon. -->
    <link rel="icon" href="/favicon.ico" sizes="any" />
    <link rel="icon" type="image/png" sizes="32x32" href="/favicon.png" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <title>Quecto Harness</title>
    <script>
      // The stylesheet chooses its palette from data-scheme on this element. The
      // stored choice is read here, before the stylesheet first applies, so a
      // reader who chose a palette is not shown another one first.
      (() => {
        const isPalette = (v) =>
          v === "light" ||
          v === "dark" ||
          v === "high-contrast-light" ||
          v === "high-contrast-dark" ||
          v === "grey-paper" ||
          v === "cream";
        let palette = "light";
        let follow = true;
        try {
          const raw = localStorage.getItem("quecto.theme");
          if (isPalette(raw)) palette = raw;
          follow = localStorage.getItem("quecto.follow") !== "0";
        } catch {
          // The operating system decides.
        }
        if (follow) {
          palette = matchMedia("(prefers-contrast: more)").matches
            ? matchMedia("(prefers-color-scheme: dark)").matches
              ? "high-contrast-dark"
              : "high-contrast-light"
            : matchMedia("(prefers-color-scheme: dark)").matches
              ? "dark"
              : "light";
        }
        document.documentElement.dataset.scheme = palette;
      })();
    </script>
  </head>
  <body>
    <div id="app"></div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
